<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Routine</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17233a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#e8ebf0;--card:#fff;--ink:#12171d;--mute:#5b6773;--line:#d5dbe3;--acc:#ff6b2c;--accink:#fff;--done:#19a974;--sh:0 6px 18px rgba(20,30,50,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1115;--card:#181d23;--ink:#eef1f4;--mute:#97a3af;--line:#2a323b;--accink:#0e1115;--done:#3ddc97;--sh:0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0e1115;--card:#181d23;--ink:#eef1f4;--mute:#97a3af;--line:#2a323b;--accink:#0e1115;--done:#3ddc97;--sh:0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 400px at 85% -10%,rgba(255,107,44,.16),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(80,110,255,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
main{max-width:560px;margin:0 auto;padding:18px 14px 90px}
h1{font-size:38px;line-height:1;margin:6px 0 4px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(90deg,var(--ink),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:0 0 16px}
nav{display:flex;gap:4px;margin:0 0 16px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
nav button{flex:1;border:0;background:transparent;color:var(--mute);padding:10px 6px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;transition:background .2s,color .2s}
nav button[aria-pressed="true"]{background:linear-gradient(135deg,var(--acc),#ff9a3d);color:#fff;box-shadow:0 4px 12px rgba(255,107,44,.4)}
.chips{display:flex;gap:6px;margin:0 0 16px}
.chip{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 6px;border-radius:99px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;margin:0 0 14px;color:#fff;background:linear-gradient(135deg,#17233a,#32204f 60%,#4a2340);box-shadow:var(--sh);border:1px solid rgba(255,255,255,.08)}
.hero h2{margin:0 0 2px;font-size:22px;letter-spacing:-.01em}
.hero .cnt{margin:0;color:rgba(255,255,255,.75);font-size:14px}
.ring{width:84px;height:84px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.rb{stroke:rgba(255,255,255,.14)}.rf{stroke:var(--acc);transition:stroke-dasharray .5s cubic-bezier(.2,.8,.2,1)}
.hero.win{background:linear-gradient(135deg,#0f3d33,#17674f);animation:glow 1.6s ease-out 1}
.hero.win .rf{stroke:#7dffc4}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(61,220,151,.7)}100%{box-shadow:0 0 0 26px rgba(61,220,151,0)}}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 10px;box-shadow:var(--sh);animation:up .4s both}
.ex:nth-child(2){animation-delay:.04s}.ex:nth-child(3){animation-delay:.08s}.ex:nth-child(4){animation-delay:.12s}.ex:nth-child(5){animation-delay:.16s}.ex:nth-child(6){animation-delay:.2s}.ex:nth-child(n+7){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.top b{font-size:17px}.meta{color:var(--mute);font-size:13px;font-weight:700;white-space:nowrap;background:var(--bg);padding:3px 9px;border-radius:99px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.sets{display:flex;gap:9px;flex-wrap:wrap}
.plate{width:48px;height:48px;border-radius:50%;border:3px solid var(--line);background:var(--bg);color:var(--ink);font:800 16px system-ui;cursor:pointer;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.plate:active{transform:scale(.9)}
.plate[aria-pressed="true"]{background:linear-gradient(135deg,var(--done),#7dffc4);border-color:transparent;color:#06281c;box-shadow:0 4px 14px rgba(25,169,116,.45);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.18)}}
.wt{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;font-weight:600}
.wt input{width:76px;padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:17px;font-weight:700;text-align:right}
.ex.ok{border-color:var(--done)}
.set{display:flex;flex-direction:column;align-items:center;gap:5px}
.rp{width:48px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:700;text-align:center;-moz-appearance:textfield}
.rp::-webkit-inner-spin-button,.rp::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hist.up{color:var(--done)}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vb{border:1px solid var(--line);background:transparent;color:var(--mute);padding:6px 11px;border-radius:99px;font:600 13px system-ui;cursor:pointer}
.vb[aria-pressed="true"]{color:var(--ink);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:var(--sh)}
.msg b{font-size:22px;display:block;margin-bottom:4px}
.day{display:flex;justify-content:space-between;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 8px;box-shadow:var(--sh)}
.day.now{border:2px solid var(--acc);background:linear-gradient(135deg,rgba(255,107,44,.12),var(--card))}
.day span:first-child{font-weight:800}.day span:last-child{color:var(--mute);text-align:right}
h2{font-size:18px;margin:20px 0 8px}
ul{padding-left:20px;margin:0 0 6px}li{margin:0 0 6px}
.t{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.t b{min-width:92px;font-variant-numeric:tabular-nums;color:var(--acc)}
.small{font-size:14px;color:var(--mute)}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;margin:6px 6px 0 0}
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;border-radius:99px;padding:14px 22px;background:linear-gradient(135deg,var(--acc),#ff9a3d);color:#fff;font:800 16px system-ui;box-shadow:0 10px 28px rgba(255,107,44,.5);cursor:pointer;z-index:9}
#rest[hidden]{display:none}
nav button{font-size:14px;padding:10px 2px}
.hist{margin:10px 0 0;font-size:13px;color:var(--mute);font-weight:600}
.pb{background:linear-gradient(135deg,var(--acc),#ff9a3d);color:#fff;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:800;margin-left:6px}
.note{width:100%;margin-top:8px;padding:9px 11px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:14px}
.spark{width:120px;height:32px;flex:none}
.form{display:flex;gap:8px;margin-top:12px}
.form select,.form input{min-width:0;flex:1;padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.form input{width:62px}.form .chip{flex:none;padding:10px 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.styles{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;padding:2px}
.sp{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);padding:7px 14px;border-radius:99px;font:700 13px system-ui;cursor:pointer}
.sp[aria-pressed="true"]{color:var(--ink);border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
/* Concrete: industrial, hard edges, hazard yellow */
:root[data-style="concrete"]{--bg:#d8d5ce;--card:#efece6;--ink:#111;--mute:#4a4741;--line:#111;--acc:#ffd400;--accink:#111;--done:#111;--sh:4px 4px 0 #111}
[data-style="concrete"] body{background:var(--bg);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
[data-style="concrete"] h1{background:none;color:var(--ink);text-transform:uppercase;letter-spacing:-.05em}
[data-style="concrete"] :is(.ex,.msg,.day,nav,.hero,.chip,.plate,.wt input,.rp,.vb,.note,.form select,.form input,.meta,.ghost,.sp,#rest,.pb,nav button){border-radius:0}
[data-style="concrete"] :is(.ex,.msg,.day,nav,.hero,.chip,.wt input,.rp,.form select,.form input,.sp,.ghost){border:2px solid #111}
[data-style="concrete"] :is(.ex,.msg,.day,nav,.sp[aria-pressed="true"]){box-shadow:var(--sh)}
[data-style="concrete"] nav button[aria-pressed="true"]{background:var(--acc);color:#111;box-shadow:none}
[data-style="concrete"] .hero,[data-style="concrete"] .hero.win{background:#111;animation:none}
[data-style="concrete"] .hero.win .rf{stroke:#fff}
[data-style="concrete"] .plate{background:var(--card);border:3px solid #111}
[data-style="concrete"] .plate[aria-pressed="true"]{background:#111;color:var(--acc);box-shadow:none}
[data-style="concrete"] .pb{background:var(--acc);color:#111}
[data-style="concrete"] #rest{background:var(--acc);color:#111;border:2px solid #111;box-shadow:4px 4px 0 #111}
[data-style="concrete"] .day.now{background:var(--acc)}
[data-style="concrete"] .t b{color:#111}
[data-style="concrete"] .chip[aria-pressed="true"]{background:#111;color:var(--acc)}
/* Paper: calm, serif, minimal */
:root[data-style="paper"]{--bg:#f6f4ee;--card:#fffefb;--ink:#1d1d1b;--mute:#6b6a64;--line:#e2dfd5;--acc:#2f6f4f;--accink:#fff;--done:#2f6f4f;--sh:none}
[data-style="paper"] body{background:var(--bg);font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
[data-style="paper"] h1{background:none;color:var(--ink);font-weight:700;letter-spacing:-.02em}
[data-style="paper"] :is(.ex,.msg,.day,nav,.hero){box-shadow:none;border-radius:12px}
[data-style="paper"] nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
[data-style="paper"] .hero{background:var(--card);color:var(--ink);border:1px solid var(--line)}
[data-style="paper"] .hero .cnt{color:var(--mute)}
[data-style="paper"] .rb{stroke:var(--line)}
[data-style="paper"] .hero.win{background:#e8f1ec;animation:none}
[data-style="paper"] .plate[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:none}
[data-style="paper"] .pb{background:var(--acc)}
[data-style="paper"] #rest{background:var(--ink);color:var(--bg);box-shadow:0 8px 20px rgba(0,0,0,.2)}
[data-style="paper"] .day.now{border:1px solid var(--acc);background:#eef4f0}
/* Neon: black glass, cyan and violet glow */
:root[data-style="neon"]{--bg:#05060a;--card:rgba(255,255,255,.05);--ink:#f2f6ff;--mute:#8d97b3;--line:rgba(140,160,255,.22);--acc:#5ef2ff;--accink:#05060a;--done:#b388ff;--sh:0 8px 30px rgba(94,242,255,.06)}
[data-style="neon"] body{background:radial-gradient(700px 420px at 90% -5%,rgba(179,136,255,.25),transparent 60%),radial-gradient(700px 420px at -10% 15%,rgba(94,242,255,.18),transparent 60%),#05060a;background-attachment:fixed}
[data-style="neon"] h1{background:linear-gradient(90deg,#5ef2ff,#b388ff);-webkit-background-clip:text;background-clip:text}
[data-style="neon"] nav button[aria-pressed="true"]{background:linear-gradient(135deg,#5ef2ff,#b388ff);color:#05060a;box-shadow:0 0 16px rgba(94,242,255,.5)}
[data-style="neon"] .hero{background:linear-gradient(135deg,rgba(94,242,255,.14),rgba(179,136,255,.16));border:1px solid rgba(94,242,255,.35)}
[data-style="neon"] .rf{filter:drop-shadow(0 0 4px #5ef2ff)}
[data-style="neon"] .hero.win{background:linear-gradient(135deg,rgba(179,136,255,.25),rgba(94,242,255,.12))}
[data-style="neon"] .hero.win .rf{stroke:#d9c2ff}
[data-style="neon"] .ex{backdrop-filter:blur(8px)}
[data-style="neon"] .plate[aria-pressed="true"]{background:linear-gradient(135deg,#5ef2ff,#b388ff);color:#05060a;box-shadow:0 0 14px rgba(94,242,255,.6)}
[data-style="neon"] .pb,[data-style="neon"] #rest{background:linear-gradient(135deg,#5ef2ff,#b388ff);color:#05060a}
[data-style="neon"] .day.now{border:2px solid #5ef2ff;background:rgba(94,242,255,.08)}

.how{display:block;margin-top:10px;background:none;border:0;color:var(--ink);font:700 14px system-ui;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.demo{margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.dtabs{display:flex;gap:6px;margin:0 0 8px}.dtabs .chip{padding:7px 6px;font-size:13px}
#dv{display:block;width:100%;max-width:360px;height:auto;margin:0 auto;background:var(--bg);border-radius:14px}
.cues{padding-left:18px;margin:10px 0 0;font-size:14px;color:var(--mute)}

.eqp{margin:10px 0 0;font-size:14px}
</style>
</head>
<body>
<main>
  <h1 id="h"></h1>
  <p class="sub" id="s"></p>
  <div class="styles" id="st" role="group" aria-label="App style"></div>
  <nav aria-label="Sections">
    <button data-tab="today" aria-pressed="true">Workout</button>
    <button data-tab="week" aria-pressed="false">Week</button>
    <button data-tab="progress" aria-pressed="false">Progress</button>
    <button data-tab="notes" aria-pressed="false">Fuel</button>
  </nav>
  <div id="app"></div>
  <button id="rest" hidden aria-live="polite"></button>
</main>
<script>
var K='gym-routine-v1';
var S={start:null,flip:false,w:{},done:{},fin:{},h:{},n:{},c:[],r:{},v:{}};
try{var r=JSON.parse(localStorage.getItem(K));if(r&&typeof r==='object'){S=Object.assign(S,r)}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}

var W={
 A:{title:'Workout A',items:[['leg','Leg press',3,'8-12'],['chest','Chest press machine',3,'8-12'],['row','Seated cable row',3,'8-12'],['shp','Shoulder press machine',2,'8-12'],['curl','Leg curl',2,'10-15'],['core','Cable crunch or plank',2,'10-15']]},
 B:{title:'Workout B',items:[['squat','Hack squat or goblet squat',3,'8-12'],['lat','Lat pulldown',3,'8-12'],['inc','Incline chest press',3,'8-12'],['hip','Hip thrust or back extension',2,'10-12'],['lat2','Lateral raise',2,'12-15'],['arms','Bicep curl and tricep pushdown',2,'10-15 each']]}
};
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var tab='today',view='today',shownDay='';

function pad(n){return n<10?'0'+n:''+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function monday(d){var m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m}
var now=new Date();
if(!S.start){S.start=dkey(monday(now));save()}
function weekIdx(){var a=monday(now),p=S.start.split('-'),b=new Date(+p[0],+p[1]-1,+p[2]);return Math.round((a-b)/(7*864e5))}
function swapped(){return (weekIdx()%2!==0)!==S.flip}
function sessionFor(dow){
 var order={1:0,3:1,5:2};
 if(!(dow in order))return null;
 var a=swapped()?['B','A','B']:['A','B','A'];
 return a[order[dow]];
}
function plan(dow){
 var s=sessionFor(dow);
 if(s)return s==='A'?'Workout A':'Workout B';
 return {2:'Rest',4:'Rest',6:'Hike',0:'D&D and full rest'}[dow];
}

var NAMES={},TOP={};W.A.items.concat(W.B.items).forEach(function(x){NAMES[x[0]]=x[1];TOP[x[0]]=parseInt(x[3].split('-')[1],10)});
// Slots that offer a choice of lift: [id, name, rep range, unit]. Each variant keeps its own weight, reps,
// history and settings note. The first variant reuses the slot id, so history logged before variants lands there.
var VAR={
 squat:[['squat','Hack squat'],['goblet','Goblet squat']],
 hip:[['hip','Hip thrust'],['backext','Back extension']],
 core:[['core','Cable crunch'],['plank','Plank','30-45','sec']]
};
var UNIT={};
Object.keys(VAR).forEach(function(sl){VAR[sl].forEach(function(v){NAMES[v[0]]=v[1];TOP[v[0]]=v[2]?parseInt(v[2].split('-')[1],10):TOP[sl];if(v[3])UNIT[v[0]]=v[3]})});
function variant(sl){var vs=VAR[sl];if(!vs)return null;for(var i=0;i<vs.length;i++)if(vs[i][0]===S.v[sl])return vs[i];return vs[0]}
// Suggested jump once every set hits the top of the rep range: bigger for the heavy lower-body lifts.
var INC={leg:5,squat:5,hip:5};
// S.r[id] holds [date, [reps per set]] for each session, oldest first.
function repsOn(id,d){var R=S.r[id]||[];for(var i=R.length-1;i>=0;i--)if(R[i][0]===d)return R[i][1];return null}
function lastReps(id){var R=S.r[id]||[],t=dkey(now);for(var i=R.length-1;i>=0;i--)if(R[i][0]!==t)return R[i];return null}
function topAll(r,top){return !!(r&&r.length&&top&&r.every(function(v){return v!=null&&v>=top}))}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function histHtml(id,n){
 var hs=S.h[id]||[],t=dkey(now),prev=hs.filter(function(x){return x[0]!==t}),lw=prev.length?prev[prev.length-1]:null,last=lw?lw[1]:null,pb=0,pp=0,cur=S.w[id];
 hs.forEach(function(x){if(x[1]>pb)pb=x[1]});prev.forEach(function(x){if(x[1]>pp)pp=x[1]});
 var lr=lastReps(id),reps=lr&&lr[1].some(function(v){return v!=null})?lr[1].map(function(v){return v==null?'-':v}).join(', '):'';
 if(UNIT[id]==='sec'){var tp=TOP[id],tt=repsOn(id,t);
  return '<p class="hist">'+(reps?'Last time '+reps+' sec':'No history yet')+'</p>'+(tt&&tt.length>=n&&topAll(tt,tp)?'<p class="hist up">Held '+tp+'+ seconds on every set. Try a harder plank next time.</p>':lr&&topAll(lr[1],tp)?'<p class="hist up">Held '+tp+'+ seconds on every set last time. Try a harder plank, like raising one foot.</p>':'')}
 var line=last!=null?'Last time '+last+' kg'+(reps&&lr[0]===lw[0]?' &times; '+reps:'')+' &middot; PB '+pb+' kg':reps?'Last time '+reps+' reps':'No history yet';
 var badge=(cur!=null&&pp>0&&cur>pp)?' <span class="pb">New PB</span>':'';
 var top=TOP[id],tr=repsOn(id,t),tip='';
 if(tr&&tr.length>=n&&topAll(tr,top))tip='Top of the range on every set. Add weight next time.';
 else if(lr&&topAll(lr[1],top)){var base=(lw&&lw[0]===lr[0])?lw[1]:last;if(base!=null&&!(cur>base))tip='Hit '+top+'+ reps on every set last time. Try '+(base+(INC[id]||2.5))+' kg today.'}
 return '<p class="hist">'+line+badge+'</p>'+(tip?'<p class="hist up">'+tip+'</p>':'');
}
function extra(sl,id,n){
 return '<div class="hw">'+histHtml(id,n)+'</div>'+'<input class="note" data-n="'+id+'" value="'+esc(S.n[id]||'')+'" placeholder="Seat and machine settings" aria-label="Settings note for '+esc(NAMES[id])+'">'+howHtml(sl);
}
var openHow=null,demoIx=0,raf=0;
var DEMO={

function render(){
 var dow=now.getDay(),today=sessionFor(dow);shownDay=dkey(now);
 document.getElementById('h').textContent=DAYS[dow];
 document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.tab===tab?'true':'false')});
 var el=document.getElementById('app');
 if(tab==='week')el.innerHTML=weekHtml();
 else if(tab==='progress')el.innerHTML=progressHtml();
 else if(tab==='notes')el.innerHTML=notesHtml();
 else el.innerHTML=workoutHtml(dow,today);
 document.getElementById('s').textContent=subText();
 if(openHow&&tab==='today')startDemo();else stopDemo();
}

function subText(){
 var dow=now.getDay(),nf=Object.keys(S.fin||{}).length;
 return plan(dow)+' today. '+(sessionFor(dow)?'Week '+(weekIdx()%2===0?'1':'2')+' order'+(S.flip?' (flipped)':'')+'. ':'')+nf+' session'+(nf===1?'':'s')+' finished so far.';
}
function heroHtml(title,dn,tot){

 return '<div class="hero'+(win?' win':'')+'" data-title="'+esc(title)+'"><svg class="ring" viewBox="0 0 44 44" role="img" aria-label="'+pct+' percent complete"><circle class="rb" cx="22" cy="22" r="19"/><circle class="rf" cx="22" cy="22" r="19" style="stroke-dasharray:'+(pct*1.1938).toFixed(1)+' 119.4"/></svg><div><h2>'+title+' &middot; '+pct+'%</h2><p class="cnt">'+dn+' of '+tot+' done'+(win?'. Session complete, now eat.':'')+'</p></div></div>';

function markFin(dk,dn,tot){if(tot&&dn===tot&&!S.fin[dk]){S.fin[dk]=1;save()}}
// Update ticks, the progress ring and the subtitle in place, so typing reps never loses focus to a full render.

 document.querySelectorAll('#app .ex').forEach(function(ex){var ps=ex.querySelectorAll('.plate'),all=true;
  ps.forEach(function(p){var on=!!D[p.dataset.k];p.setAttribute('aria-pressed',on);tot++;if(on)dn++;else all=false});
